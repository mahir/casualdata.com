<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>casualdata · a data visualization every day</title>
  <meta name="description" content="A new data visualization every day. From casualdata, making work from casual data since 2005.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="/kit/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/host-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/ioskeley-mono-regular.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/kit/theme.js"></script>
  <link rel="stylesheet" href="/kit/cd.css">
</head>
<body class="cd-home">

<header class="cd-bar">
  <a class="cd-mark" href="/" aria-current="page" aria-label="casualdata"><img class="wm wm-d" src="/kit/wordmark.svg" alt="" width="110" height="20"><img class="wm wm-l" src="/kit/wordmark-light.svg" alt="" width="110" height="20"><img class="sym wm-d" src="/kit/mark.svg" alt="" width="23" height="20"><img class="sym wm-l" src="/kit/mark-light.svg" alt="" width="23" height="20"></a>
  <p class="cd-meta" style="margin:0" id="count"></p>
  <a class="cd-textlink" href="/work/">Work 2007–2014</a>
</header>

<main>
  <h1 class="cd-intro">A new data visualization every day.</h1>
  <ol class="cd-days" id="days" role="list"></ol>
</main>

<footer class="cd-homefoot">
  <p class="about">A new data visualization every day. Made by casualdata since 2005. The <a href="/work/">work from 2007 to 2014</a> is in the archive.</p>
  <p class="cd-meta">All data is somehow casual, 2005–today.</p>
</footer>

<script src="/kit/days.js"></script>
<script src="/kit/cd.js"></script>
<script>
  // Newest first. The newest day takes a full row with its intro; the rest follow as an even grid of tiles.
  // Each tile shows the day's preview in the reader's theme (thumb.webp by day, thumb-night.webp by night).
  const list = CD.days.slice().reverse();
  const dark = () => document.documentElement.dataset.theme === "dark";
  const srcset = d => { const n = dark() ? "thumb-night" : "thumb"; return `${d.path}${n}.webp 720w, ${d.path}${n}-1200.webp 1200w`; };
  document.getElementById("count").textContent = `${list.length} days so far`;
  const grid = document.getElementById("days");
  grid.innerHTML = list.map((d, i) => `
    <li class="tile${i === 0 ? " lead" : ""}"><a href="${d.path}">
      <img srcset="${srcset(d)}" sizes="${i === 0 ? "(max-width: 960px) 100vw, 66vw" : "(max-width: 600px) 100vw, (max-width: 960px) 50vw, (max-width: 1200px) 33vw, 25vw"}" src="${d.path}thumb.webp" width="1200" height="630" alt="" ${i < 2 ? 'fetchpriority="high"' : 'loading="lazy"'}>
      <span class="cd-meta">${i === 0 ? '<i class="dot" aria-hidden="true"></i>Latest · ' : ""}${CD.fmtDate(d.date)}</span>
      <span class="t">${d.title}</span>
      ${i === 0 && d.dek ? `<span class="dek">${d.dek}</span>` : ""}
    </a></li>`).join("");
  // the theme turns at 07:00 and 19:00 while the page is open
  document.addEventListener("cd-theme", () => grid.querySelectorAll("img").forEach((img, i) => { img.srcset = srcset(list[i]); }));
</script>
</body>
</html>
