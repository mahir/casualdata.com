# Posts a day's image to Instagram (tools/instagram.js). It is started for the day's date when the
# day is published (NEXT.md, "Instagram"); the schedule below is only a fallback. Secret: IG_ACCESS_TOKEN, the
# token from the Meta app dashboard (tools/instagram.js says which kinds work).
# A token that starts with EAA can't be refreshed: when it expires the Post step fails, and it is
# replaced by hand. A token that starts with IG lasts 60 days; the Refresh step renews it and stores
# it back in the secret, which needs SECRETS_PAT (a fine-grained GitHub token for this repository
# with "Secrets: read and write"). Optional variable IG_USER_ID: the Instagram account's ID, only
# needed if an EAA token covers several accounts or Meta lists none for it.
name: Instagram

on:
  schedule:
    # A fallback for a day that was not posted when it was published. 04:07 in New York all year,
    # then two runs in plain UTC (05:37 and 08:37 in New York in winter, an hour later in summer).
    # GitHub starts these hours late or not at all (on 18 Nov 2026 one of three ran, at 17:56 UTC),
    # so don't count on them. A day that is already posted is skipped.
    - cron: "7 4 * * *"
      timezone: "America/New_York"
    - cron: "37 10 * * *"
    - cron: "37 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to post (YYYY-MM-DD). Empty: today's"
        required: false
      mode:
        description: "post, check (Instagram checks the image, nothing is published) or dry-run"
        type: choice
        options: [post, check, dry-run]
        default: post

permissions:
  contents: read

concurrency: instagram

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          DAY: ${{ inputs.date }}
          MODE: ${{ inputs.mode || 'post' }}
        run: |
          flag=""
          [ "$MODE" != post ] && flag="--$MODE"
          node tools/instagram.js ${DAY:+"$DAY"} $flag
      - name: Refresh token
        if: always() && (inputs.mode || 'post') != 'dry-run'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SECRETS_PAT not set; token not refreshed"; exit 0; fi
          if t=$(node tools/instagram.js --refresh) && [ -n "$t" ]; then
            echo "::add-mask::$t"
            printf %s "$t" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          else
            echo "token not refreshed (an IG token can be refreshed once it is a day old; an EAA token never)"
          fi
