# The private heart on casualdata daily day pages (index.js). Deploy from this folder:
#   npx wrangler@4.168.0 deploy
# Read the counts: ./hearts.sh
name = "casualdata-heart"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "heart.casualdata.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "casualdata-hearts"
database_id = "00dcdbaf-554e-4948-8c64-45e4b50130ba"
